<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#08141f"/>
  <!-- Guard → Middle line -->
  <line x1="32" y1="14" x2="16" y2="50" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Guard → Exit line -->
  <line x1="32" y1="14" x2="48" y2="50" stroke="#39ff14" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Middle → Exit line -->
  <line x1="16" y1="50" x2="48" y2="50" stroke="#9fc6e0" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Guard node (top center) -->
  <circle cx="32" cy="14" r="6" fill="#00d4ff"/>
  <!-- Middle node (bottom left) -->
  <circle cx="16" cy="50" r="6" fill="#9fc6e0"/>
  <!-- Exit node (bottom right) -->
  <circle cx="48" cy="50" r="6" fill="#39ff14"/>
</svg>
