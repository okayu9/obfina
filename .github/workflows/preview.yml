name: Preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - run: npm install -g pnpm@11.5.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke test
        run: |
          pnpm preview -- --host 127.0.0.1 --port 4173 &
          for i in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          pnpm test:smoke http://127.0.0.1:4173/ 1000

  preview:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - run: npm install -g pnpm@11.5.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Generate Cloudflare config
        run: pnpm cloudflare:bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=obfina --branch=${{ github.head_ref }}
