name: Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging-config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "CLOUDFLARE_ACCOUNT_ID is required" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "CLOUDFLARE_API_TOKEN is required" >&2
            exit 1
          }

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/run-quality
        with:
          fixture-data: 'true'
          wait-ms: '1000'
          playwright-cache-key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          playwright-cache-restore-key: playwright-${{ runner.os }}-

  staging:
    runs-on: ubuntu-latest
    needs:
      - staging-config
      - quality
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.obfina.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/download-artifact@v7
        with:
          name: cloudflare-build
          path: .svelte-kit

      - name: Generate Cloudflare config
        run: pnpm cloudflare:bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=obfina --branch=staging
