name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "CLOUDFLARE_ACCOUNT_ID is required" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "CLOUDFLARE_API_TOKEN is required" >&2
            exit 1
          }

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: .svelte-kit
          if-no-files-found: error
          include-hidden-files: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm exec playwright install --with-deps chromium

      - uses: ./.github/actions/run-smoke
        with:
          fixture-data: 'false'
          wait-ms: '1000'

  deploy:
    runs-on: ubuntu-latest
    needs:
      - deploy-config
      - quality
    timeout-minutes: 8
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: .svelte-kit

      - name: Generate Cloudflare config
        run: pnpm cloudflare:bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=obfina --branch=main
